services:
  # MySQL: Metadata Storage
  mysql:
    image: mysql:8.0
    container_name: ats_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_teaching_db}
      MYSQL_USER: ${MYSQL_USER:-ats_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_mysql_password}
    ports:
      - "${MYSQL_PORT:-127.0.0.1:3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # MongoDB: Textbook content & AI analysis
  mongo:
    image: mongo:6.0
    container_name: ats_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change_me_mongo_password}
    ports:
      - "${MONGO_PORT:-127.0.0.1:27017}:27017"
    volumes:
      - mongo_data:/data/db

  # Qdrant: Vector Database for RAG
  qdrant:
    image: qdrant/qdrant
    container_name: ats_qdrant
    restart: always
    ports:
      - "${QDRANT_PORT:-127.0.0.1:6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Neo4j: Knowledge Graph
  neo4j:
    image: neo4j:5.12.0
    container_name: ats_neo4j
    restart: always
    ports:
      - "${NEO4J_HTTP_PORT:-127.0.0.1:7474}:7474" # HTTP
      - "${NEO4J_BOLT_PORT:-127.0.0.1:7687}:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change_me_neo4j_password}
    volumes:
      - neo4j_data:/data

  # Backend: Go + Python Parser
  backend:
    build: ./backend
    container_name: ats_backend
    restart: always
    depends_on:
      - mysql
      - mongo
      - qdrant
      - neo4j
    environment:
      - MYSQL_DSN=${MYSQL_USER:-ats_user}:${MYSQL_PASSWORD:-change_me_mysql_password}@tcp(mysql:3306)/${MYSQL_DATABASE:-ai_teaching_db}?charset=utf8mb4&parseTime=True&loc=Local
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-change_me_mongo_password}@mongo:27017
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - DOUBAO_MODEL_ID=${DOUBAO_MODEL_ID:-ep-20260314143559-m78rx}
      - DOUBAO_EMBEDDING_MODEL=${DOUBAO_EMBEDDING_MODEL:-doubao-embedding-text-240715}
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-change_me_neo4j_password}
      - GIN_MODE=${GIN_MODE:-release}
    ports:
      - "${BACKEND_PORT:-127.0.0.1:8080}:8080"
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend: React + Nginx
  frontend:
    build: ./frontend
    container_name: ats_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  mysql_data:
  mongo_data:
  qdrant_data:
  neo4j_data:
